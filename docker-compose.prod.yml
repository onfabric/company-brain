# Production override, applied on top of docker-compose.yml on the EC2 box:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml ...
#
# Differences from local dev:
#   - Nango image comes from ECR (${NANGO_IMAGE_URI}) instead of being built locally.
#   - Server/Connect-UI ports are bound to loopback; only Caddy is public.
#   - Caddy terminates TLS (Let's Encrypt) and reverse-proxies the public host.

services:
  nango-server:
    image: ${NANGO_IMAGE_URI}
    build: !reset null
    ports: !override
      - "127.0.0.1:3003:3003"
      - "127.0.0.1:3009:3009"

  nango-orchestrator:
    image: ${NANGO_IMAGE_URI}
    build: !reset null

  nango-persist:
    image: ${NANGO_IMAGE_URI}
    build: !reset null

  nango-jobs:
    image: ${NANGO_IMAGE_URI}
    build: !reset null

  brain:
    image: ${BRAIN_IMAGE_URI}
    build: !reset null

  dozzle:
    environment:
      DOZZLE_AUTH_PROVIDER: simple
    volumes:
      - ./dozzle/data:/data

  caddy:
    image: caddy:2.8
    container_name: caddy
    restart: always
    # No depends_on: it makes compose restart Caddy whenever an upstream is
    # recreated (every deploy recreates brain), taking the proxy down for the
    # upstream's health-gate window. Caddy's lb_try_duration already rides out
    # upstreams that aren't accepting yet, on cold boot and during a recreate.
    ports:
      - "80:80"
      - "443:443"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2019/config/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    environment:
      - NANGO_HOSTNAME
      - NANGO_CONNECT_HOSTNAME
      - BRAIN_HOSTNAME
      - DOZZLE_HOSTNAME
      - ACME_EMAIL
    volumes:
      - ./caddy:/etc/caddy:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - nango

volumes:
  caddy-data:
    driver: local
  caddy-config:
    driver: local
