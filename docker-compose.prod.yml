# Production override, applied on top of docker-compose.yml on the EC2 box:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml ...
#
# Differences from local dev:
#   - Nango image comes from ECR (${IMAGE_URI}) instead of being built locally.
#   - Server/Connect-UI ports are bound to loopback; only Caddy is public.
#   - Caddy terminates TLS (Let's Encrypt) and reverse-proxies the public host.

services:
  nango-server:
    image: ${IMAGE_URI}
    build: !reset null
    ports: !override
      - "127.0.0.1:3003:3003"
      - "127.0.0.1:3009:3009"

  nango-orchestrator:
    image: ${IMAGE_URI}
    build: !reset null

  nango-persist:
    image: ${IMAGE_URI}
    build: !reset null

  nango-jobs:
    image: ${IMAGE_URI}
    build: !reset null

  dozzle:
    environment:
      DOZZLE_AUTH_PROVIDER: simple
    volumes:
      - ./dozzle/data:/data

  caddy:
    image: caddy:2.8
    container_name: caddy
    restart: always
    depends_on:
      - nango-server
      - dozzle
    ports:
      - "80:80"
      - "443:443"
    environment:
      - NANGO_HOSTNAME
      - NANGO_CONNECT_HOSTNAME
      - DOZZLE_HOSTNAME
      - ACME_EMAIL
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - nango

volumes:
  caddy-data:
    driver: local
  caddy-config:
    driver: local
