# Production override, applied on top of docker-compose.yml on the EC2 box:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml ...
#
# Differences from local:
#   - Server/Connect-UI ports are bound to loopback; only Caddy is public.
#   - Caddy terminates TLS (Let's Encrypt) and reverse-proxies the public host.

services:
  nango-server:
    ports: !override
      - "127.0.0.1:3003:3003"
      - "127.0.0.1:3009:3009"

  dozzle:
    environment:
      DOZZLE_AUTH_PROVIDER: simple
    volumes:
      - ./dozzle/data:/data

  # Nightly pg_dumpall to S3 (see infra/pg-backup). Prod-only: local dev has
  # nothing worth backing up. AWS credentials come from the instance role via
  # IMDS; run `docker exec pg-backup backup.sh` for an on-demand backup.
  pg-backup:
    image: ${PG_BACKUP_IMAGE_URI}
    container_name: pg-backup
    restart: always
    environment:
      PGHOST: postgres-db
      PGUSER: ${NANGO_DB_USER}
      PGPASSWORD: ${NANGO_DB_PASSWORD}
      BACKUP_BUCKET: ${BACKUP_BUCKET}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
    networks:
      - nango

  caddy:
    image: caddy:2.8
    container_name: caddy
    restart: always
    # No depends_on: it makes compose restart Caddy whenever an upstream is
    # recreated (every deploy recreates brain), taking the proxy down for the
    # upstream's health-gate window. Caddy's lb_try_duration already rides out
    # upstreams that aren't accepting yet, on cold boot and during a recreate.
    ports:
      - "80:80"
      - "443:443"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2019/config/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    environment:
      - NANGO_HOSTNAME
      - NANGO_CONNECT_HOSTNAME
      - BRAIN_HOSTNAME
      - DOZZLE_HOSTNAME
      - ACME_EMAIL
    volumes:
      - ./caddy:/etc/caddy:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - nango

# Data-bearing volumes are bind-backed by the persistent EBS volume mounted at
# /data (see infra/deploy/ensure_data_volume.sh), so they survive instance
# replacement. Derived volumes (nango-integrations, caddy-config) stay on the
# root disk; deploys rebuild them.
volumes:
  postgres-data:
    driver_opts:
      type: none
      o: bind
      device: /data/volumes/postgres-data
  elasticsearch-data:
    driver_opts:
      type: none
      o: bind
      device: /data/volumes/elasticsearch-data
  caddy-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/volumes/caddy-data
  caddy-config:
    driver: local
