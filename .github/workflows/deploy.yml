name: CI/CD (dev)

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

concurrency:
  group: cicd-dev
  cancel-in-progress: false

permissions:
  id-token: write # assume AWS roles via OIDC
  contents: read

env:
  AWS_REGION: eu-west-2
  SSM_SECRET_PREFIX: /company-brain/dev
  NANGO_HOSTNAME: nango-dev.onfabric.io
  DEPLOY_GROUP: company-brain-dev

jobs:
  # 1) Ensure infrastructure exists / is up to date.
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.4

      - run: terraform init -input=false
      - run: terraform fmt -check -recursive

      - name: Plan (PRs)
        if: github.event_name == 'pull_request'
        run: terraform plan -input=false -no-color -var-file=dev.tfvars

      - name: Apply (main / manual)
        if: github.event_name != 'pull_request'
        run: terraform apply -input=false -auto-approve -no-color -var-file=dev.tfvars

      - name: Outputs
        if: github.event_name != 'pull_request'
        run: |
          {
            echo '## Terraform outputs'
            echo '```'
            terraform output
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # 2) Build, push, and deploy the app. Runs only after infra is ready, and
  #    never on PRs.
  deploy:
    needs: terraform
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          IMAGE_REPO: ${{ vars.ECR_REPOSITORY }}
        run: |
          IMAGE_URI="${IMAGE_REPO}:${GITHUB_SHA}"
          docker build -t "$IMAGE_URI" -t "${IMAGE_REPO}:latest" ./nango
          docker push "$IMAGE_URI"
          docker push "${IMAGE_REPO}:latest"
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

      - name: Assemble runtime bundle
        run: |
          set -euo pipefail
          mkdir -p bundle/db bundle/nango/packages/providers
          cp docker-compose.yml docker-compose.prod.yml Caddyfile bundle/
          cp infra/deploy/on_box_deploy.sh bundle/
          cp db/entrypoint.sh db/init.sql bundle/db/
          cp nango/packages/providers/providers.yaml bundle/nango/packages/providers/
          tar czf bundle.tar.gz -C bundle .

      - name: Upload bundle to S3
        run: aws s3 cp bundle.tar.gz "s3://${{ vars.ARTIFACTS_BUCKET }}/dev/latest.tar.gz"

      - name: Deploy on instance via SSM
        run: infra/deploy/ssm_deploy.sh
        env:
          BUCKET: ${{ vars.ARTIFACTS_BUCKET }}
          DEPLOY_GROUP: ${{ env.DEPLOY_GROUP }}
          IMAGE_URI: ${{ env.IMAGE_URI }}
          SSM_SECRET_PREFIX: ${{ env.SSM_SECRET_PREFIX }}
          NANGO_HOSTNAME: ${{ env.NANGO_HOSTNAME }}
          ACME_EMAIL: ${{ vars.ACME_EMAIL }}
          AWS_REGION: ${{ env.AWS_REGION }}
