name: CI/CD (dev)

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

concurrency:
  group: cicd-dev
  cancel-in-progress: false

permissions:
  id-token: write # assume AWS roles via OIDC
  contents: read

env:
  AWS_REGION: eu-west-2
  SSM_SECRET_PREFIX: /company-brain/dev
  NANGO_HOSTNAME: nango-dev.onfabric.io
  DEPLOY_GROUP: company-brain-dev

jobs:
  # 1) Ensure infrastructure exists / is up to date.
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.4

      - run: terraform init -input=false
      - run: terraform fmt -check -recursive

      - name: Plan (PRs)
        if: github.event_name == 'pull_request'
        run: terraform plan -input=false -no-color -var-file=dev.tfvars

      - name: Apply (main / manual)
        if: github.event_name != 'pull_request'
        run: terraform apply -input=false -auto-approve -no-color -var-file=dev.tfvars

      - name: Outputs
        if: github.event_name != 'pull_request'
        run: |
          {
            echo '## Terraform outputs'
            echo '```'
            terraform output
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # 2) Build, push, and deploy the app. Runs only after infra is ready, and
  #    never on PRs.
  deploy:
    needs: terraform
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          IMAGE_REPO: ${{ vars.ECR_REPOSITORY }}
        run: |
          IMAGE_URI="${IMAGE_REPO}:${GITHUB_SHA}"
          docker build -t "$IMAGE_URI" -t "${IMAGE_REPO}:latest" ./nango
          docker push "$IMAGE_URI"
          docker push "${IMAGE_REPO}:latest"
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

      - name: Assemble runtime bundle
        run: |
          set -euo pipefail
          mkdir -p bundle/db bundle/nango/packages/providers
          cp docker-compose.yml docker-compose.prod.yml Caddyfile bundle/
          cp infra/deploy/on_box_deploy.sh bundle/
          cp db/entrypoint.sh db/init.sql bundle/db/
          cp nango/packages/providers/providers.yaml bundle/nango/packages/providers/providers.yaml
          cat > bundle/deploy.env <<EOF
          AWS_DEFAULT_REGION=${AWS_REGION}
          SSM_SECRET_PREFIX=${SSM_SECRET_PREFIX}
          NANGO_HOSTNAME=${NANGO_HOSTNAME}
          ACME_EMAIL=${{ vars.ACME_EMAIL }}
          IMAGE_URI=${IMAGE_URI}
          EOF
          tar czf bundle.tar.gz -C bundle .

      - name: Upload bundle to S3
        run: |
          aws s3 cp bundle.tar.gz "s3://${{ vars.ARTIFACTS_BUCKET }}/dev/${GITHUB_SHA}.tar.gz"
          aws s3 cp bundle.tar.gz "s3://${{ vars.ARTIFACTS_BUCKET }}/dev/latest.tar.gz"

      - name: Trigger deploy on instance via SSM
        run: |
          set -euo pipefail
          BUCKET="${{ vars.ARTIFACTS_BUCKET }}"
          cat > ssm-params.json <<JSON
          {"commands":[
            "set -euo pipefail",
            "rm -rf /opt/company-brain && mkdir -p /opt/company-brain",
            "aws s3 cp s3://${BUCKET}/dev/latest.tar.gz /tmp/bundle.tar.gz",
            "tar xzf /tmp/bundle.tar.gz -C /opt/company-brain",
            "chmod +x /opt/company-brain/on_box_deploy.sh",
            "/opt/company-brain/on_box_deploy.sh"
          ]}
          JSON
          cmd_id=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ${GITHUB_SHA}" \
            --targets "Key=tag:DeployGroup,Values=${DEPLOY_GROUP}" \
            --parameters file://ssm-params.json \
            --query "Command.CommandId" --output text)
          echo "SSM command: $cmd_id"

          instance_id=$(aws ec2 describe-instances \
            --filters "Name=tag:DeployGroup,Values=${DEPLOY_GROUP}" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" --output text)

          echo "Waiting for command to finish on $instance_id ..."
          aws ssm wait command-executed --command-id "$cmd_id" --instance-id "$instance_id" || true

          status=$(aws ssm get-command-invocation --command-id "$cmd_id" --instance-id "$instance_id" --query Status --output text)
          echo "Status: $status"
          aws ssm get-command-invocation --command-id "$cmd_id" --instance-id "$instance_id" --query StandardOutputContent --output text || true
          if [ "$status" != "Success" ]; then
            echo "::error::Deploy command did not succeed"
            aws ssm get-command-invocation --command-id "$cmd_id" --instance-id "$instance_id" --query StandardErrorContent --output text || true
            exit 1
          fi
