name: CD (dev)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-dev
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # assume AWS roles via OIDC

env:
  AWS_REGION: eu-west-2
  SSM_SECRET_PREFIX: /company-brain/dev
  NANGO_HOSTNAME: nango-dev.onfabric.io
  NANGO_CONNECT_HOSTNAME: nango-auth-dev.onfabric.io
  DOZZLE_HOSTNAME: dozzle-dev.onfabric.io
  DEPLOY_GROUP: company-brain-dev
  NO_COLOR: "1"

jobs:
  terraform-apply:
    runs-on: ubuntu-latest
    outputs:
      nango_ecr_repository_url: ${{ steps.tf_outputs.outputs.nango_ecr_repository_url }}
      brain_ecr_repository_url: ${{ steps.tf_outputs.outputs.brain_ecr_repository_url }}
      artifacts_bucket: ${{ steps.tf_outputs.outputs.artifacts_bucket }}
      github_deploy_role_arn: ${{ steps.tf_outputs.outputs.github_deploy_role_arn }}
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/prepare

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - run: terraform init -input=false
      - run: terraform apply -input=false -auto-approve -var-file=dev.tfvars

      - name: Capture outputs
        id: tf_outputs
        run: |
          echo "nango_ecr_repository_url=$(terraform output -raw nango_ecr_repository_url)" >> "$GITHUB_OUTPUT"
          echo "brain_ecr_repository_url=$(terraform output -raw brain_ecr_repository_url)" >> "$GITHUB_OUTPUT"
          echo "artifacts_bucket=$(terraform output -raw artifacts_bucket)" >> "$GITHUB_OUTPUT"
          echo "github_deploy_role_arn=$(terraform output -raw github_deploy_role_arn)" >> "$GITHUB_OUTPUT"

      - name: Outputs
        run: |
          {
            echo '## Terraform outputs'
            echo '```'
            terraform output
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  build-docker-nango:
    needs: terraform-apply
    runs-on: ubuntu-latest
    outputs:
      docker_image_tag: ${{ steps.build.outputs.image-tag }}
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build and push
        id: build
        uses: ./.github/actions/build-and-push-docker
        with:
          aws-region: ${{ env.AWS_REGION }}
          deploy-role-arn: ${{ needs.terraform-apply.outputs.github_deploy_role_arn }}
          ecr-repository-url: ${{ needs.terraform-apply.outputs.nango_ecr_repository_url }}
          context: ./nango
          dockerfile: ./nango/Dockerfile
          cache-scope: nango

  build-docker-brain:
    needs: terraform-apply
    runs-on: ubuntu-latest
    outputs:
      docker_image_tag: ${{ steps.build.outputs.image-tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build and push
        id: build
        uses: ./.github/actions/build-and-push-docker
        with:
          aws-region: ${{ env.AWS_REGION }}
          deploy-role-arn: ${{ needs.terraform-apply.outputs.github_deploy_role_arn }}
          ecr-repository-url: ${{ needs.terraform-apply.outputs.brain_ecr_repository_url }}
          context: .
          dockerfile: backend/Dockerfile
          cache-scope: brain

  build-bundle:
    needs: terraform-apply
    runs-on: ubuntu-latest
    outputs:
      bundle_url: ${{ steps.meta.outputs.bundle_url }}
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ needs.terraform-apply.outputs.github_deploy_role_arn }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve bundle URL
        id: meta
        env:
          ARTIFACTS_BUCKET: ${{ needs.terraform-apply.outputs.artifacts_bucket }}
        run: echo "bundle_url=s3://$ARTIFACTS_BUCKET/dev/$GITHUB_SHA.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Package runtime bundle
        run: |
          tar czf bundle.tar.gz \
            docker-compose.yml docker-compose.prod.yml Caddyfile \
            db/entrypoint.sh db/init.sql db/prepare \
            nango/packages/providers/providers.yaml \
            -C infra/deploy on_box_deploy.sh

      - name: Upload bundle to S3
        run: aws s3 cp bundle.tar.gz "${{ steps.meta.outputs.bundle_url }}"

  deploy:
    needs: [terraform-apply, build-docker-nango, build-docker-brain, build-bundle]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ needs.terraform-apply.outputs.github_deploy_role_arn }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy on instance via SSM
        run: infra/deploy/ssm_deploy.sh
        env:
          BUNDLE_URL: ${{ needs.build-bundle.outputs.bundle_url }}
          DEPLOY_GROUP: ${{ env.DEPLOY_GROUP }}
          NANGO_IMAGE_URI: ${{ needs.build-docker-nango.outputs.docker_image_tag }}
          BRAIN_IMAGE_URI: ${{ needs.build-docker-brain.outputs.docker_image_tag }}
          SSM_SECRET_PREFIX: ${{ env.SSM_SECRET_PREFIX }}
          NANGO_HOSTNAME: ${{ env.NANGO_HOSTNAME }}
          NANGO_CONNECT_HOSTNAME: ${{ env.NANGO_CONNECT_HOSTNAME }}
          DOZZLE_HOSTNAME: ${{ env.DOZZLE_HOSTNAME }}
          ACME_EMAIL: ${{ vars.ACME_EMAIL }}
          AWS_REGION: ${{ env.AWS_REGION }}

  deploy-nango-integrations:
    needs: deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nango-integrations
    env:
      NANGO_SECRET_KEY_DEV: ${{ secrets.NANGO_SECRET_KEY_DEV }}
      NANGO_DEPLOY_AUTO_CONFIRM: "true"
      NANGO_CLI_DEPENDENCY_UPDATE: "false"
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/prepare

      - run: bun test
      - run: NANGO_HOSTPORT="https://${NANGO_HOSTNAME}" bun run deploy dev --no-interactive --no-dependency-update
