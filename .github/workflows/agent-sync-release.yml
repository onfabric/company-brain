name: Agent Sync Release

on:
  push:
    tags:
      - agent-sync-v*
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example agent-sync-v0.1.0
        required: true

concurrency:
  group: agent-sync-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  NO_COLOR: "1"
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/prepare

      - name: Check
        run: bun check:all

      - name: Test
        run: bun run test

      - name: Build agent-sync release assets
        run: scripts/build-agent-sync-release.sh

      - name: Write release notes
        run: |
          cat > release-notes.md <<'EOF'
          ## Install

          ```bash
          curl -fsSL https://github.com/${{ github.repository }}/releases/latest/download/install.sh | bash
          ```

          To install a specific version:

          ```bash
          curl -fsSL https://github.com/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}/install.sh \
            | COMPANY_BRAIN_AGENT_SYNC_VERSION=${{ env.RELEASE_TAG }} bash
          ```

          Assets include standalone macOS binaries for Apple Silicon and Intel Macs.
          EOF

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            dist/agent-sync-release/* \
            --target "$GITHUB_SHA" \
            --title "Agent Sync $RELEASE_TAG" \
            --notes-file release-notes.md
