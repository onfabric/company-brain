name: Build and push Docker image
description: Build and push a Docker image, tagged with an immutable tag and latest.

inputs:
  image-repository:
    description: Target image repository, without a tag.
    required: true
  image-tag:
    description: Immutable image tag to deploy.
    required: true
  context:
    description: Docker build context.
    required: true
  dockerfile:
    description: Path to the Dockerfile.
    required: true
  cache-scope:
    description: GitHub Actions cache scope; keep distinct per image to avoid collisions.
    required: true
  platforms:
    description: Comma-separated target platforms.
    required: false
    default: linux/amd64,linux/arm64

outputs:
  image-uri:
    description: The immutable image reference that was pushed.
    value: ${{ steps.tags.outputs.immutable }}

runs:
  using: composite
  steps:
    - name: Prepare tags
      id: tags
      shell: bash
      env:
        IMAGE_REPOSITORY: ${{ inputs.image-repository }}
        IMAGE_TAG: ${{ inputs.image-tag }}
      run: |
        echo "immutable=$IMAGE_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"
        echo "latest=$IMAGE_REPOSITORY:latest" >> "$GITHUB_OUTPUT"

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push image
      shell: bash
      env:
        IMAGE_REPOSITORY: ${{ inputs.image-repository }}
        IMAGE_TAG: ${{ inputs.image-tag }}
        PLATFORM: ${{ inputs.platforms }}
        BUILD_CONTEXT: ${{ inputs.context }}
        DOCKERFILE: ${{ inputs.dockerfile }}
        CACHE_SCOPE: ${{ inputs.cache-scope }}
        CACHE_FROM: type=gha,scope=${{ inputs.cache-scope }}
        CACHE_TO: type=gha,mode=max,scope=${{ inputs.cache-scope }}
        SOURCE_LABEL: https://github.com/${{ github.repository }}
      run: infra/deploy/build_and_push_image.sh
