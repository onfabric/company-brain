name: Build and push Docker image
description: Build and push a Docker image with the requested tags.

inputs:
  image-repository:
    description: Target image repository, without a tag.
    required: true
  image-tag:
    description: Primary image tag to deploy.
    required: true
  extra-tags:
    description: Space-separated extra image tags to publish for the same image.
    required: false
    default: ""
  context:
    description: Docker build context.
    required: true
  dockerfile:
    description: Path to the Dockerfile.
    required: true
  cache-scope:
    description: GitHub Actions cache scope; keep distinct per image to avoid collisions.
    required: true
outputs:
  image-uri:
    description: The immutable image reference to deploy.
    value: ${{ steps.tags.outputs.immutable }}

runs:
  using: composite
  steps:
    - name: Prepare tags
      id: tags
      shell: bash
      env:
        IMAGE_REPOSITORY: ${{ inputs.image-repository }}
        IMAGE_TAG: ${{ inputs.image-tag }}
      run: |
        echo "immutable=$IMAGE_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

    - name: Check for existing image
      id: existing-image
      shell: bash
      env:
        IMAGE_URI: ${{ steps.tags.outputs.immutable }}
      run: |
        if docker manifest inspect "$IMAGE_URI" >/dev/null 2>&1; then
          echo "exists=true" >> "$GITHUB_OUTPUT"
          echo "Image $IMAGE_URI already exists; skipping build." >> "$GITHUB_STEP_SUMMARY"
        else
          echo "exists=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Set up Docker Buildx
      if: steps.existing-image.outputs.exists != 'true'
      uses: docker/setup-buildx-action@v3

    - name: Build and push image
      if: steps.existing-image.outputs.exists != 'true'
      shell: bash
      env:
        IMAGE_REPOSITORY: ${{ inputs.image-repository }}
        IMAGE_TAG: ${{ inputs.image-tag }}
        EXTRA_IMAGE_TAGS: ${{ inputs.extra-tags }}
        BUILD_CONTEXT: ${{ inputs.context }}
        DOCKERFILE: ${{ inputs.dockerfile }}
        CACHE_SCOPE: ${{ inputs.cache-scope }}
        CACHE_FROM: type=gha,scope=${{ inputs.cache-scope }}
        CACHE_TO: type=gha,mode=max,scope=${{ inputs.cache-scope }}
        SOURCE_LABEL: https://github.com/${{ github.repository }}
      run: infra/deploy/build_and_push_image.sh
