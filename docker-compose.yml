# The nango services are inspired by the Nango Docker compose file in the ./nango submodule.

# Postgres image, shared by the database and the one-shot brain DB bootstrap (so
# the bootstrap's psql client always matches the server).
x-db-image: &db-image paradedb/paradedb:0.23.5-pg18

# Shared base for every Nango container: one image, built once from the
# submodule's Dockerfile, reused by server / orchestrator / persist / jobs.
x-nango-base: &nango-base
  image: company-brain/nango:local
  build:
    context: ./nango
    dockerfile: Dockerfile
  restart: always
  networks:
    - nango

services:
  nango-db:
    image: *db-image
    container_name: nango-db
    entrypoint: ["/usr/local/bin/db-entrypoint.sh"]
    environment:
      POSTGRES_USER: ${NANGO_DB_USER}
      POSTGRES_DB: ${NANGO_DB_NAME}
      POSTGRES_PASSWORD: ${NANGO_DB_PASSWORD}
      NANGO_DB_NAME: ${NANGO_DB_NAME}
    volumes:
      # PG 18+ expects the parent dir mounted; data lives under /var/lib/postgresql/18/...
      - postgres-data:/var/lib/postgresql
      - ./db/entrypoint.sh:/usr/local/bin/db-entrypoint.sh:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Generous so a fresh-volume init on a small/loaded box has time to settle:
      # ParadeDB preloads pg_search/pg_cron/vector and the data dir restarts once
      # mid-init. Too short and a full `up` (DB initializing while every other
      # service starts) trips the depends_on:service_healthy gate and aborts.
      start_period: 120s
    restart: always
    networks:
      - nango

  nango-server:
    <<: *nango-base
    command: ["packages/server/entrypoint.sh"]
    environment:
      - NANGO_ENCRYPTION_KEY
      - NANGO_DB_USER
      - NANGO_DB_PASSWORD
      - NANGO_DB_HOST=nango-db
      - NANGO_DB_PORT=5432
      - NANGO_DB_NAME
      - NANGO_DB_SCHEMA
      - NANGO_DB_SSL=false
      - RECORDS_DATABASE_URL=postgresql://${NANGO_DB_USER}:${NANGO_DB_PASSWORD}@nango-db:5432/${NANGO_DB_NAME}
      - RECORDS_DATABASE_SCHEMA=${NANGO_RECORDS_DATABASE_SCHEMA}
      - SERVER_PORT=3003
      - CSP_REPORT_ONLY=true
      - NANGO_SERVER_URL
      - NANGO_PUBLIC_SERVER_URL
      - NANGO_PUBLIC_CONNECT_URL
      - FLAG_AUTH_ENABLED
      - NANGO_DASHBOARD_USERNAME
      - NANGO_DASHBOARD_PASSWORD
      - LOG_LEVEL
      - NANGO_LOGS_ENABLED=true
      - NANGO_LOGS_ES_URL=http://nango-elasticsearch:9200
      - NANGO_LOGS_ES_USER=nango
      - NANGO_LOGS_ES_PWD=nango
      - FLAG_SERVE_CONNECT_UI=true
      - NANGO_ENTERPRISE=true
      - ORCHESTRATOR_SERVICE_URL=http://nango-orchestrator:3008
      - PERSIST_SERVICE_URL=http://nango-persist:3007
      - JOBS_SERVICE_URL=http://nango-jobs:3005
      - NANGO_REDIS_URL=redis://nango-redis:6379
    volumes:
      - ./nango/packages/providers/providers.yaml:/app/nango/packages/providers/providers.yaml:ro
      - nango-integrations:/app/nango/packages/shared/dist/nango-integrations
    ports:
      - "${NANGO_SERVER_PORT}:3003"
      - "${NANGO_CONNECT_UI_PORT}:3009"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      nango-db:
        condition: service_healthy
      nango-elasticsearch:
        condition: service_healthy

  nango-orchestrator:
    <<: *nango-base
    command: ["node", "packages/orchestrator/dist/app.js"]
    environment:
      - NANGO_ENCRYPTION_KEY
      - NANGO_DB_USER
      - NANGO_DB_PASSWORD
      - NANGO_DB_HOST=nango-db
      - NANGO_DB_PORT=5432
      - NANGO_DB_NAME
      - NANGO_DB_SCHEMA
      - NANGO_DB_SSL=false
      - RECORDS_DATABASE_URL=postgresql://${NANGO_DB_USER}:${NANGO_DB_PASSWORD}@nango-db:5432/${NANGO_DB_NAME}
      - RECORDS_DATABASE_SCHEMA=${NANGO_RECORDS_DATABASE_SCHEMA}
      - NANGO_ORCHESTRATOR_PORT=3008
      - NANGO_REDIS_URL=redis://nango-redis:6379
      - NANGO_LOGS_ENABLED=true
      - NANGO_LOGS_ES_URL=http://nango-elasticsearch:9200
      - NANGO_LOGS_ES_USER=nango
      - NANGO_LOGS_ES_PWD=nango
      - NANGO_ENTERPRISE=true
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3008/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      nango-db:
        condition: service_healthy
      nango-redis:
        condition: service_healthy

  nango-persist:
    <<: *nango-base
    command: ["node", "packages/persist/dist/app.js"]
    environment:
      - NANGO_ENCRYPTION_KEY
      - NANGO_DB_USER
      - NANGO_DB_PASSWORD
      - NANGO_DB_HOST=nango-db
      - NANGO_DB_PORT=5432
      - NANGO_DB_NAME
      - NANGO_DB_SCHEMA
      - NANGO_DB_SSL=false
      - RECORDS_DATABASE_URL=postgresql://${NANGO_DB_USER}:${NANGO_DB_PASSWORD}@nango-db:5432/${NANGO_DB_NAME}
      - RECORDS_DATABASE_SCHEMA=${NANGO_RECORDS_DATABASE_SCHEMA}
      - NANGO_PERSIST_PORT=3007
      - NANGO_REDIS_URL=redis://nango-redis:6379
      - NANGO_LOGS_ENABLED=true
      - NANGO_LOGS_ES_URL=http://nango-elasticsearch:9200
      - NANGO_LOGS_ES_USER=nango
      - NANGO_LOGS_ES_PWD=nango
      - NANGO_ENTERPRISE=true
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3007/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      nango-db:
        condition: service_healthy
      nango-redis:
        condition: service_healthy

  nango-jobs:
    <<: *nango-base
    command: ["node", "packages/jobs/dist/app.js"]
    environment:
      - NANGO_ENCRYPTION_KEY
      - NANGO_DB_USER
      - NANGO_DB_PASSWORD
      - NANGO_DB_HOST=nango-db
      - NANGO_DB_PORT=5432
      - NANGO_DB_NAME
      - NANGO_DB_SCHEMA
      - NANGO_DB_SSL=false
      - RECORDS_DATABASE_URL=postgresql://${NANGO_DB_USER}:${NANGO_DB_PASSWORD}@nango-db:5432/${NANGO_DB_NAME}
      - RECORDS_DATABASE_SCHEMA=${NANGO_RECORDS_DATABASE_SCHEMA}
      - NANGO_JOBS_PORT=3005
      - ORCHESTRATOR_SERVICE_URL=http://nango-orchestrator:3008
      - PERSIST_SERVICE_URL=http://nango-persist:3007
      - NANGO_SERVER_URL=http://nango-server:3003
      - SERVER_SERVICE_URL=http://nango-server:3003
      - NANGO_REDIS_URL=redis://nango-redis:6379
      - RUNNER_TYPE=LOCAL
      - NANGO_RUNNER_PATH=/app/nango/packages/runner/dist/app.js
      - NANGO_LOGS_ENABLED=true
      - NANGO_LOGS_ES_URL=http://nango-elasticsearch:9200
      - NANGO_LOGS_ES_USER=nango
      - NANGO_LOGS_ES_PWD=nango
      - NANGO_ENTERPRISE=true
    volumes:
      - nango-integrations:/app/nango/packages/shared/dist/nango-integrations
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3005/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      nango-db:
        condition: service_healthy
      nango-redis:
        condition: service_healthy
      nango-orchestrator:
        condition: service_healthy
      nango-persist:
        condition: service_healthy

  nango-redis:
    image: redis:8.8.0
    container_name: nango-redis
    ports:
      - "127.0.0.1:${REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - nango

  nango-elasticsearch:
    image: elasticsearch:8.19.16
    container_name: nango-elasticsearch
    ulimits:
      memlock:
        soft: -1
        hard: -1
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    ports:
      - "127.0.0.1:${ELASTICSEARCH_PORT}:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: always
    networks:
      - nango

  # Idempotent DB bootstrap: runs the numbered scripts in db/prepare in order, as
  # the Postgres superuser, before dependents start. Unlike the initdb scripts
  # (which only run on a brand-new data dir), this runs on every up, so it also
  # provisions the already-initialized Nango database. Add more scripts as needed.
  db-prepare:
    image: *db-image
    container_name: db-prepare
    entrypoint: ["sh", "/db-prepare/entrypoint.sh"]
    environment:
      - PGHOST=nango-db
      - PGUSER=${NANGO_DB_USER}
      - PGPASSWORD=${NANGO_DB_PASSWORD}
      - PGDATABASE=${NANGO_DB_NAME}
      - BRAIN_DB_USER=${BRAIN_DB_USER}
      - BRAIN_DB_PASSWORD=${BRAIN_DB_PASSWORD}
      - NANGO_RECORDS_DATABASE_SCHEMA=${NANGO_RECORDS_DATABASE_SCHEMA}
    volumes:
      - ./db/prepare:/db-prepare:ro
    depends_on:
      nango-db:
        condition: service_healthy
    restart: "no"
    networks:
      - nango

  brain:
    image: company-brain/brain:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: brain
    environment:
      - DATABASE_URL=postgresql://${BRAIN_DB_USER}:${BRAIN_DB_PASSWORD}@nango-db:5432/${NANGO_DB_NAME}
    ports:
      - "127.0.0.1:${BRAIN_SERVER_PORT}:3010"
    healthcheck:
      test: ["CMD", "/busybox/wget", "-q", "--spider", "http://localhost:3010/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: always
    depends_on:
      db-prepare:
        condition: service_completed_successfully
    networks:
      - nango

  usage-dashboard:
    image: company-brain/usage-dashboard:local
    build:
      context: .
      dockerfile: usage-dashboard/Dockerfile
    container_name: usage-dashboard
    environment:
      - DATABASE_URL=postgresql://${BRAIN_DB_USER}:${BRAIN_DB_PASSWORD}@nango-db:5432/${NANGO_DB_NAME}
      - AI_USAGE_PRICING_JSON
      - USAGE_DASHBOARD_USERNAME
      - USAGE_DASHBOARD_PASSWORD
    ports:
      - "127.0.0.1:${USAGE_DASHBOARD_PORT}:3011"
    healthcheck:
      test: ["CMD", "/busybox/wget", "-q", "--spider", "http://localhost:3011/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: always
    depends_on:
      db-prepare:
        condition: service_completed_successfully
    networks:
      - nango

  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    environment:
      - DOZZLE_NO_ANALYTICS=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:${DOZZLE_PORT}:8080"
    healthcheck:
      test: ["CMD", "/dozzle", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - nango

networks:
  nango:

volumes:
  postgres-data:
    driver: local
  elasticsearch-data:
    driver: local
  nango-integrations:
    driver: local
